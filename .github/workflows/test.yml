name: Test

on:
  push:
    branches:
      - run/*
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  YARN_VERSION: 1.22.22

jobs:
  test-js:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Corepack is no longer bundled with Node.js, as in the Dockerfile
      - name: Install Yarn
        run: npm install -g "yarn@${YARN_VERSION}"

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile --network-timeout 600000

      - name: Run Jest
        run: yarn run test:jest

  test-ruby:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      RAILS_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      DISABLE_SIMPLECOV: true

    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg imagemagick libicu-dev libidn-dev

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install Yarn
        run: npm install -g "yarn@${YARN_VERSION}"

      - uses: ruby/setup-ruby@78c62f2208e480ce3d5ae4dfd9b9e181acf48b63 # v1.344.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile --network-timeout 600000

      - name: Build the frontend for tests
        run: |
          # Webpacker (before the Vite migration) needs the legacy OpenSSL provider on current Node.js
          if [ -f config/webpacker.yml ]; then
            export NODE_OPTIONS=--openssl-legacy-provider
          fi
          bin/rails assets:precompile

      - name: Load the database schema
        run: bin/rails db:create db:schema:load

      - name: Run RSpec
        run: |
          # Set by GitHub Actions, it would change the source code URL that the specs expect
          unset GITHUB_REPOSITORY
          bundle exec rspec
